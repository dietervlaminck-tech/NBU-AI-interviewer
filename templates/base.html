<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Interviewer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% block header %}
    <header class="header">
        <div class="container-wide header-inner">
            <a href="/" class="logo">
                <div class="logo-shield">N</div>
                <div>
                    <div class="logo-text">AI Interviewer</div>
                    <div class="logo-sub">Nyenrode Business Universiteit</div>
                </div>
            </a>
            <nav class="nav">
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Create Study</a>
                <a href="/dashboard" class="{% if '/dashboard' in request.path %}active{% endif %}">Dashboard</a>
            </nav>
        </div>
    </header>
    {% endblock %}
    {% block body %}{% endblock %}
    {% block footer %}
    <div class="footer-bar">
        <div class="container-wide">
            <span class="payoff">Nyenrode. A Reward for Life</span>
        </div>
    </div>
    {% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
